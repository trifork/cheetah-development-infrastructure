---
services:
  kafka:
    image: ${CHEETAH_DOCKER_REGISTRY-}cheetah-infrastructure-utils-kafka:strimzi-1.0.1-kafka-4.1.0-trifork-2.0.0

    container_name: kafka
    hostname: kafka
    mem_limit: 1024m
    command:
      [
        "sh",
        "-c",
        "bin/kafka-storage.sh format --ignore-formatted --cluster-id iBzfyk2mT5qGMuO9Yu0WrQ --config /opt/kafka/custom-config/kraft.properties && bin/kafka-server-start.sh /opt/kafka/custom-config/kraft.properties",
      ]
    depends_on:
      keycloak-setup:
        condition: service_completed_successfully
    ports:
      - "9092:9092" # Requires OAuth2 authentication
      - "9093:9093" # Requires No authentication
    expose:
      - "9093"
    environment:
      LOG_DIR: "/tmp/logs"
      KAFKA_ROOT_LOGGER_LEVEL: debug
    volumes:
      - ./config/kafka/kraft.properties:/opt/kafka/custom-config/kraft.properties
      # - ./config/kafka/log4j.properties:/opt/kafka/custom-config/log4j.properties # enables debug logging
    restart: unless-stopped
    healthcheck:
      # bash `/dev/tcp` builtin 
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9093"]
      interval: 30s # (default: 30s)
      timeout: 10s # (default: 30s)
      retries: 3 #  (default: 3)
      start_period: 30s # (default: 0s)
    profiles:
      - kafka-core
      - schema-registry-core
      - core
      - kafka
      - observability
      - full

  kafka-setup:
    image: quay.io/strimzi/kafka:1.0.1-kafka-4.1.0
    container_name: kafka-setup
    volumes:
      - ./config/kafkaconfig.sh:/etc/config/kafkaconfig.sh
      - ./config/kafka/kafkasetup.config:/etc/config/kafkasetup.config
    command: "bash /etc/config/kafkaconfig.sh"
    depends_on:
      kafka:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
    environment:
      # The following settings are listed here only to satisfy the image's requirements.
      # We override the image's `command` anyways, hence this container will not start a broker.
      KAFKA_BROKER_ID: ignored
      KAFKA_ZOOKEEPER_CONNECT: ignored
      KAFKA_TOPICS: ${INITIAL_KAFKA_TOPICS}
    profiles:
      - kafka-core
      - schema-registry-core
      - core
      - kafka
      - observability
      - full

  redpanda:
    mem_limit: 128m
    container_name: redpanda
    image: redpandadata/console:v3.7.4
    entrypoint: /bin/sh
    command: -c "/app/console"
    environment:
      CONFIG_FILEPATH: /etc/redpanda-config.yml
    volumes:
      - ./config/redpanda-admin.yaml:/etc/redpanda-config.yml # get FULL access to kafka from redpanda
      # - ./config/redpanda-cluster.yaml:/etc/redpanda-config.yml # use OAUTH2 authentication with limited access like on a cluster
    ports:
      - "9898:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    profiles:
      - kafka
      - full

  # Kafka Prometheus exporter https://github.com/cloudhut/kminion
  kafka-minion:
    mem_limit: 128m
    image: redpandadata/kminion:v2.3.4
    hostname: kafka-minion
    container_name: kafka-minion
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - 8088:8080
    environment:
      KAFKA_BROKERS: kafka:19093
    profiles:
      - observability
      - full

  schema-registry:
    mem_limit: 256m
    image: apicurio/apicurio-registry:3.1.7
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
      kafka-setup:
        condition: service_completed_successfully
    ports:
      - "8081:8080" # http://localhost:8081/ui/
    restart: unless-stopped
    environment:
      # Storage
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:19092
      APICURIO_KAFKASQL_TOPIC: kafkasql-journal-v3
      APICURIO_KAFKASQL_SNAPSHOTS_TOPIC: kafkasql-snapshots
      APICURIO_EVENTS_KAFKA_TOPIC: registry-events
      APICURIO_KAFKASQL_TOPIC_AUTO_CREATE: "false"
      # Kafka SASL / OAuth (schema-registry -> broker)
      APICURIO_KAFKASQL_SECURITY_PROTOCOL: SASL_PLAINTEXT
      APICURIO_KAFKASQL_SECURITY_SASL_ENABLED: "true"
      APICURIO_KAFKASQL_SECURITY_SASL_MECHANISM: OAUTHBEARER
      APICURIO_KAFKASQL_SECURITY_SASL_CLIENT_ID: schema-registry
      APICURIO_KAFKASQL_SECURITY_SASL_CLIENT_SECRET: schema-registry-secret
      APICURIO_KAFKASQL_SECURITY_SASL_TOKEN_ENDPOINT: http://keycloak:1852/realms/local-development/protocol/openid-connect/token
      APICURIO_KAFKASQL_SECURITY_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler
      # Read by the Strimzi callback handler; needed so the JWT includes the `Kafka_*` roles.
      OAUTH_SCOPE: kafka
      # Basics
      APICURIO_AUTH_ANONYMOUS_READ_ACCESS_ENABLED: "true"
      APICURIO_UI_FEATURES_READ_ONLY_ENABLED: "true"
      # API protection
      QUARKUS_OIDC_TENANT_ENABLED: "true" # also protects UI
      APICURIO_AUTH_ROLE_BASED_AUTHORIZATION: "true" # Allows admin and developer concept
      APICURIO_AUTH_OWNER_ONLY_AUTHORIZATION: "true"
      APICURIO_AUTH_OWNER_ONLY_AUTHORIZATION_LIMIT_GROUP_ACCESS: "true"
      APICURIO_AUTH_ROLE_SOURCE: token
      APICURIO_AUTH_ROLES_DEVELOPER: sr-producer # default is "sr-developer"
      # https://quarkus.io/guides/security-oidc-configuration-properties-reference
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:1852/realms/local-development
      QUARKUS_OIDC_ROLES_ROLE_CLAIM_PATH: roles
      QUARKUS_OIDC_AUTHENTICATION_VERIFY_ACCESS_TOKEN: "true"
      QUARKUS_OIDC_TOKEN_AUDIENCE: schema-registry
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:1852/realms/local-development

    healthcheck:
      test: curl schema-registry:8080 || exit -1
      interval: 30s # (default: 30s)
      timeout: 10s # (default: 30s)
      retries: 3 #  (default: 3)
      start_period: 30s # (default: 0s)
    profiles:
      - schema-registry-core
      - core
      - kafka
      - full

volumes:
  kafka:

networks:
  default:
    name: "cheetah-infrastructure"
